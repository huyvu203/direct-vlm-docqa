[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-vlm-experiment"
version = "0.1.0"
description = "Evaluation pipeline for direct VLM-based document question answering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.14.0",
    "openai>=1.68.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "typer>=0.9.0",
]

[project.scripts]
ocr-vlm-prepare = "ocr_vlm.dataset:app"
ocr-vlm-infer = "ocr_vlm.inference:app"
ocr-vlm-evaluate = "ocr_vlm.evaluation:app"

[tool.setuptools.packages.find]
where = ["src"]
